name: Sync index levels

on:
  workflow_dispatch:
  schedule:
    # 北京时间 19:30，A 股收盘之后；交易日门禁在 job 内。
    - cron: "30 11 * * 1-5"

jobs:
  sync-index-levels:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate required configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$FUYAO_API_KEY" ]; then
            echo "::error::Missing GitHub Secret: DATABASE_URL or FUYAO_API_KEY"
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Check A-share trading day
        id: gate
        uses: ./.github/actions/check-ashare-trading-day
        with:
          enabled: ${{ github.event_name == 'schedule' }}

      - name: Sync three index closes
        if: steps.gate.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FUYAO_API_KEY: ${{ secrets.FUYAO_API_KEY }}
        run: python -m scheduled_tasks.jobs.sync_index_levels
